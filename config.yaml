# Horizon API Gateway Configuration
version: "v1.0.0"
config:
  server:
    port: 8080
    admin_port: 8081
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
    
    # TLS configuration, if you want to use custom certificates
    tls:
      enabled: false
      cert_file: /etc/horizon/tls/cert.pem
      key_file: /etc/horizon/tls/key.pem

  # If you want use certbot, set enabled to true
  ssl:
    enabled: true
    certbot:
      enabled: true
      domains:
        - "yourdomain.com"
        - "*.yourdomain.com"  # Wildcard subdomain
      email: "your-email@example.com"  # Required for Let's Encrypt
      cert_path: "/etc/letsencrypt"
      renew_interval: 12h
      webroot_path: "/var/www/certbot"

  routes:
    # Basic route example
    - name: simple-api
      listen_path: /api/*
      upstream_url: http://simple-service:8000
      methods: ["GET", "POST", "PUT", "DELETE"]
      strip_path: true
      
    # Route with authentication
    - name: secured-api
      listen_path: /secure/*
      upstream_url: http://secure-service:8000
      methods: ["*"]
      strip_path: true
      auth:
        enabled: true
        type: api_key
        api_key:
          header: X-API-Key
          in: header
          keys:
            - key: your-api-key-here
              name: example-key
              metadata:
                owner: admin
              scopes: ["read", "write"]
              expires: "2024-12-31T23:59:59Z"
    
    # Route with JWT authentication
    - name: jwt-api
      listen_path: /jwt/*
      upstream_url: http://jwt-service:8000
      methods: ["*"]
      strip_path: true
      auth:
        enabled: true
        type: jwt
        jwt:
          algorithm: HS256
          secret: your-secret-key
          issuer: horizon-gateway
          audience: api-clients
          claims_to_headers:
            sub: X-User-ID
            role: X-User-Role
    
    # Route with rate limiting
    - name: rate-limited-api
      listen_path: /limited/*
      upstream_url: http://service:8000
      methods: ["*"]
      strip_path: true
      rate_limiting:
        enabled: true
        type: token_bucket
        scope: ip
        limit: 100
        window: 1m
        burst_size: 120
        response_status_code: 429
        response_body: "Too many requests. Please try again later."
        enable_headers: true
    
    # Route with caching
    - name: cached-api
      listen_path: /cached/*
      upstream_url: http://service:8000
      methods: ["GET"]
      strip_path: true
      caching:
        enabled: true
        type: memory
        ttl: 5m
        max_size: 2097152  # 2MB
        methods: ["GET"]
        cache_key_template: "{method}:{path}:{query}"
        ignore_query_params: ["random", "nocache"]
        vary_headers: ["Accept", "Accept-Encoding"]
        never_cache: ["/cached/users/*/private"]
        always_cache: ["/cached/public/*"]
        respect_cache_control: true
    
    # Route with circuit breaking
    - name: circuit-breaker-api
      listen_path: /protected/*
      upstream_url: http://service:8000
      methods: ["*"]
      strip_path: true
      circuit_breaker:
        enabled: true
        type: error
        error_threshold: 50
        minimum_requests: 20
        sampling_window: 1m
        open_state_duration: 30s
        half_open_max_requests: 5
        response_status_code: 503
        response_body: "Service temporarily unavailable due to high error rate"
    
    # Route with transformation
    - name: transformed-api
      listen_path: /transform/*
      upstream_url: http://service:8000
      methods: ["*"]
      strip_path: true
      transform:
        enabled: true
        request:
          headers:
            - name: X-API-Version
              operation: add
              value: "2.0"
            - name: User-Agent
              operation: regex
              pattern: "^(.*)$"
              replacement: "Modified-$1"
          url:
            path:
              operation: regex
              pattern: "^/transform/(.*)$"
              replacement: "/api/v2/$1"
            query:
              - name: debug
                operation: remove
              - name: version
                operation: add
                value: "2.0"
          body:
            operation: jsonpath
            content_types: ["application/json"]
            jsonpath:
              - path: "$.user.id"
                operation: replace
                value: "anonymous"
              - path: "$.sensitive"
                operation: remove
        response:
          headers:
            - name: X-Powered-By
              operation: remove
            - name: Cache-Control
              operation: add
              value: "public, max-age=3600"
          body:
            operation: template
            content_types: ["application/json"]
            template: |
              {
                "data": {{ .Body }},
                "meta": {
                  "status": {{ .StatusCode }},
                  "timestamp": "{{ now }}"
                }
              }
          status_code:
            mapping:
              404: 200
              500: 503
    
    # Route with validation
    - name: validated-api
      listen_path: /validated/*
      upstream_url: http://service:8000
      methods: ["*"]
      strip_path: true
      validation:
        enabled: true
        json_schema: |
          {
            "type": "object",
            "required": ["name", "email"],
            "properties": {
              "name": {"type": "string", "minLength": 1},
              "email": {"type": "string", "format": "email"},
              "age": {"type": "integer", "minimum": 18}
            }
          }
        content_types: ["application/json"]
        header_rules:
          - name: "Content-Type"
            required: true
          - name: "Authorization"
            required: true
            pattern: "^Bearer .+$"
        query_rules:
          - name: "version"
            required: true
            pattern: "^[0-9]+\\.[0-9]+$"
    
    # Route with WebSocket support
    - name: websocket-api
      listen_path: /ws/*
      upstream_url: ws://websocket-service:8000
      methods: ["GET"]
      strip_path: true
      websocket:
        enabled: true
        ping_interval: 30s
        pong_wait: 60s
        write_wait: 10s
        max_message_size: 512000
    
    # Route with aggregation
    - name: aggregated-api
      listen_path: /aggregate/*
      upstream_url: http://aggregation-service:8000
      methods: ["GET"]
      strip_path: true
      aggregation:
        enabled: true
        timeout: 30s
        merge_method: "combine"
        result_key: "data"
        endpoints:
          - name: users
            url: "http://user-service:8000/users"
            method: "GET"
            timeout_ms: 5000
            required: true
          - name: products
            url: "http://product-service:8000/products"
            method: "GET"
            timeout_ms: 5000
            required: false
    
    # Route with service discovery
    - name: discovered-api
      listen_path: /discover/*
      upstream_url: http://discovery-service:8000
      strip_path: true
      methods: ["*"]
      service_discovery:
        enabled: true
        type: "kubernetes"
        service_name: "example-service"
        namespace: "default"
        port: 8080
    
    # Route with IP filtering
    - name: ip-filtered-api
      listen_path: /filtered/*
      upstream_url: http://service:8000
      methods: ["*"]
      strip_path: true
      ip_filter:
        enabled: true
        mode: allow
        ips:
          - 192.168.1.0/24
          - 10.0.0.5
        response_status_code: 403
        response_body: "Access restricted"
    
    # Multi-target load balanced route
    - name: load-balanced-api
      listen_path: /balanced/*
      upstream_url: http://default-service:8000
      methods: ["*"]
      strip_path: true
      load_balancing:
        type: "weighted"
        targets:
          - url: "http://service-1:8000"
            weight: 3
          - url: "http://service-2:8000"
            weight: 2
          - url: "http://service-3:8000"
            weight: 1
        health_check:
          path: "/health"
          interval: "10s"
          timeout: "5s"
          healthy_threshold: 2
          unhealthy_threshold: 3