apiVersion: v1
kind: Service
metadata:
  name: horizon-gateway
  labels:
    app: horizon-gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: admin
  selector:
    app: horizon-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horizon-gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: horizon-gateway
                port:
                  name: http
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: horizon-gateway
                port:
                  name: admin